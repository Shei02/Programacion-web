<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="page-usuarios">
  <h1>Usuarios</h1>
  <nav>
    <a href="/">Inicio</a>
    <a href="/peliculas">Películas</a>
    <a href="/usuarios">Usuarios</a>
    <a href="/miras">Miras</a>
  </nav>

  <h2>Agregar nuevo Usuario</h2>
  <form id="usuario-form"> 
    <input type="text" id="nomusu" placeholder="Nombre de usuario" required>
    <input type="text" id="contrasenia" placeholder="Contraseña" required>
    <input type="text" id="email" placeholder="Dirección de email" required>
    <input type="date" id="fechanac" placeholder="Fecha de Nacimiento (YYYY-MM-DD)" required>
    <button type="submit">Agregar</button>
  </form>

  <h2>Nuestros usuarios</h2>
  <ul id="usuario-list"></ul>

  <script src="/static/usuarios.js"></script>
</body>
</html>
