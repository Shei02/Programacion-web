<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Miras</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="page-miras">
  <h1>Miras</h1>
  <nav>
    <a href="/">Inicio</a>
    <a href="/peliculas">Películas</a>
    <a href="/usuarios">Usuarios</a>
    <a href="/miras">Miras</a>
  </nav>

  <h2>Agregar Calificacion</h2>
  <form id="mira-form">
    <input type="number" id="idusuario" placeholder="ID Usuario" required>
    <input type="number" id="idpelicula" placeholder="ID Película" required>
    <input type="text" id="gustoono" placeholder="¿Te gustó la pelicula? (si/no)" required>
    <input type="number" id="calif" min="1" max="5" placeholder="Calificacion (del 1 al 5)" required>
    <button type="submit">Agregar</button>
  </form>

  <h2>Calificaciones de nuestros usuarios</h2>
  <ul id="mira-list"></ul>

  <script src="/static/miras.js"></script>
</body>
</html>
